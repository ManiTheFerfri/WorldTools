name: Release WorldTools (Minecraft 26.2)

on:
  push:
    tags:
      - "*+26.2"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Fabric release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify release artifact
        id: release-artifact
        shell: bash
        run: |
          set -euo pipefail

          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties)"
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties)"
          expected_version="${mod_version}+${minecraft_version}"

          if [[ "$minecraft_version" != "26.2" ]]; then
            echo "::error::Expected Minecraft 26.2, found ${minecraft_version}."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "$expected_version" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must match Gradle version ${expected_version}."
            exit 1
          fi

          ./gradlew --no-daemon --stacktrace clean build

          jar_path="build/libs/WorldTools-${expected_version}.jar"
          if [[ ! -s "$jar_path" ]]; then
            echo "::error::Expected remapped runtime JAR was not produced: ${jar_path}"
            find build/libs -maxdepth 1 -type f -name '*.jar' -print || true
            exit 1
          fi

          echo "version=${expected_version}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${minecraft_version}" >> "$GITHUB_OUTPUT"
          echo "jar_path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "Prepared ${jar_path} for release ${expected_version}."

      - name: Create GitHub Release and publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-draft: false
          github-prerelease: false
          github-generate-changelog: false

          modrinth-id: FlFKBOIX
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 909868
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: ${{ steps.release-artifact.outputs.jar_path }}
          name: WorldTools ${{ steps.release-artifact.outputs.version }} (Fabric)
          version: ${{ steps.release-artifact.outputs.version }}
          version-type: release
          changelog-file: RELEASE_NOTES_26.2.md
          loaders: fabric
          game-versions: ${{ steps.release-artifact.outputs.minecraft_version }}
          environment: client
          java: "25"
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}{curseforge:308769}
            cloth-config(required){modrinth:9s6osm5g}{curseforge:348521}
            modmenu(required){modrinth:mOgUt4GM}{curseforge:308702}
